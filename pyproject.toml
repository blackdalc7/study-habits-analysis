[project]
name = "study-habits-analysis"
version = "1.0.0"
description = "Data cleaning and analysis with pandas: how sleep, study time, coffee and phone use relate to exam scores"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.10", "tabulate>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["study_habits"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
